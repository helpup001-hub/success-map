<script>
(function() {
  /* ============================================================
     ▼▼▼ 지역별 사례 데이터 ▼▼▼
     cases : { url, area(시·군 카테고리) }
     - 전국 사례 → 대분류(지역명)로 필터
     - 지역별 사례 → 소분류(시·군)로 필터
     ============================================================ */
  const REGIONS = [
    {
      key: "gyeonggi", name: "경기도", x: 30, y: 25,
      cases: [
                                /* DRIVE_AUTO_START:ulsan */
        { url: "https://drive.google.com/thumbnail?id=11GaukCd7eYESvbzkIMnhJBc0TFcNvLF6&sz=w1000" },
        { url: "https://drive.google.com/thumbnail?id=1He4PYZ-ithzuiLg8R19XMmuJf-y16Xmt&sz=w1000" },
        /* DRIVE_AUTO_END:ulsan */,
                /* DRIVE_AUTO_START:gyeonggi */
        /* 이천 */
        { url: "https://drive.google.com/thumbnail?id=1o6Q7g_jNrtnkiTgXx39Zi7n8JRMvYQr5&sz=w1000", area: "이천" },
        /* 화성 */
        { url: "https://drive.google.com/thumbnail?id=1LzJcPA3y35ZwpL9tcfI2L0nXMgHG2KV3&sz=w1000", area: "화성" },
        { url: "https://drive.google.com/thumbnail?id=1LCJNLB4sGGNymxS1UA_xEwSbOko3r9t5&sz=w1000", area: "화성" },
        /* 이천 */
        { url: "https://drive.google.com/thumbnail?id=1vPHxZc1t-7Y4mn291mWB_Q-wtQI5KXrA&sz=w1000", area: "이천" },
        /* 포천 */
        { url: "https://drive.google.com/thumbnail?id=1TxR55gsj960PCArQC3U-quIjgb08TINe&sz=w1000", area: "포천" },
        { url: "https://drive.google.com/thumbnail?id=1avuUzkDIEmFU70cyRxg4KZqLwak__d5Y&sz=w1000", area: "포천" },
        /* 화성 */
        { url: "https://drive.google.com/thumbnail?id=1wx3D0K3Llc4ir88xMw3GuYzfuDBcx878&sz=w1000", area: "화성" },
        { url: "https://drive.google.com/thumbnail?id=1EzAthAPWJCsKEFc2Ve9mQ0ukOHoNjuUj&sz=w1000", area: "화성" },
        /* DRIVE_AUTO_END:gyeonggi */
      ]
    }
  ];

  REGIONS.forEach(function(r) {
    r.count = r.cases.length;
    r.cases.forEach(function(c) { c.region = r.name; });
  });

  const ALL_CASES = REGIONS.reduce(function(a, r) { return a.concat(r.cases); }, []);

  /* ===== 지역 리스트 ===== */
  const listEl = document.getElementById('rq-region-list');
  listEl.innerHTML = REGIONS.map(function(r) {
    var badge = r.count > 0
      ? '<span class="rq-region-update">UPDATE</span>'
      : '';
    return '<div class="rq-region-item' + (r.count === 0 ? ' is-empty' : '') + '" data-key="' + r.key + '">' +
             '<span class="rq-region-dot"></span>' +
             '<span class="rq-region-name">' + r.name + '</span>' +
             badge +
             '<span class="rq-region-arrow">›</span>' +
           '</div>';
  }).join('');

  /* ===== 지도 마커 ===== */
  const pinsEl = document.getElementById('rq-map-pins');
  pinsEl.innerHTML = REGIONS.map(function(r) {
    return '<div class="rq-pin" data-key="' + r.key + '" style="left:' + r.x + '%; top:' + r.y + '%;">' +
             '<span class="rq-pin-ring"></span>' +
             '<span class="rq-pin-dot"></span>' +
           '</div>' +
           '<div class="rq-map-label" data-key="' + r.key + '" style="left:' + r.x + '%; top:' + r.y + '%;">' +
             r.name +
           '</div>';
  }).join('');

  function setActive(key) {
    document.querySelectorAll('.rq-region-item').forEach(function(el) {
      el.classList.toggle('is-active', el.dataset.key === key);
    });
    document.querySelectorAll('.rq-map-label').forEach(function(el) {
      el.classList.toggle('is-active', el.dataset.key === key);
    });
    document.querySelectorAll('.rq-pin').forEach(function(el) {
      el.classList.toggle('is-active', el.dataset.key === key);
    });
  }

  var firstWithCases = REGIONS.find(function(r) { return r.count > 0; }) || REGIONS[0];
  setActive(firstWithCases.key);

  document.querySelectorAll('.rq-region-item, .rq-map-label').forEach(function(el) {
    el.addEventListener('mouseenter', function() { setActive(el.dataset.key); });
    el.addEventListener('click', function() { window.rqOpenCases(el.dataset.key); });
  });

  /* ===== 목록 모달 ===== */
  const modal    = document.getElementById('rq-case-modal');
  const titleEl  = document.getElementById('rq-modal-title');
  const countEl  = document.getElementById('rq-modal-count');
  const filterEl = document.getElementById('rq-filter-row');
  const gridEl   = document.getElementById('rq-case-grid');

  let curCases = [], curFilter = '전체';
  let filterKey = 'area';
  let lbList = [], lbIndex = 0;

  function filtered() {
    return (curFilter === '전체')
      ? curCases
      : curCases.filter(function(c) { return c[filterKey] === curFilter; });
  }

  function renderGrid() {
    var list = filtered();
    lbList = list;

    if (!list.length) {
      gridEl.innerHTML = '<p class="rq-empty-msg">해당 지역의 사례를 준비 중입니다.</p>';
      return;
    }
    gridEl.innerHTML = list.map(function(c, i) {
      return '<div class="rq-case-card" onclick="rqOpenLightbox(' + i + ')">' +
               '<div class="rq-card-img">' +
                 '<img src="' + c.url + '" loading="lazy" alt="승인 공문">' +
               '</div>' +
             '</div>';
    }).join('');
  }

  function sortAreas(areas) {
    var etc = areas.filter(function(a) { return a === '기타'; });
    var rest = areas.filter(function(a) { return a !== '기타'; });
    rest.sort(function(a, b) { return a.localeCompare(b, 'ko'); });
    return rest.concat(etc);
  }

  function renderFilters() {
    var vals = [];
    curCases.forEach(function(c) {
      var v = c[filterKey];
      if (v && vals.indexOf(v) === -1) vals.push(v);
    });
    if (vals.length < 2) { filterEl.innerHTML = ''; return; }

    var tabs = ['전체'].concat(sortAreas(vals));
    filterEl.innerHTML = tabs.map(function(t) {
      return '<button class="rq-filter-pill' + (t === curFilter ? ' is-active' : '') +
             '" data-area="' + t + '">' + t + '</button>';
    }).join('');

    filterEl.querySelectorAll('.rq-filter-pill').forEach(function(btn) {
      btn.addEventListener('click', function() {
        curFilter = btn.dataset.area;
        renderFilters();
        renderGrid();
      });
    });
  }

  window.rqOpenCases = function(key) {
    if (key === 'ALL') {
      curCases = ALL_CASES;
      titleEl.textContent = '전국 사례';
      filterKey = 'region';
    } else {
      const r = REGIONS.find(function(x) { return x.key === key; });
      if (!r) return;
      curCases = r.cases;
      titleEl.textContent = r.name + ' 사례';
      filterKey = 'area';
      setActive(key);
    }
    curFilter = '전체';
    countEl.innerHTML = '총 <b>' + curCases.length + '건</b>의 철저한 보안 검수를 마친 대표사례 입니다.';
    renderFilters();
    renderGrid();
    modal.classList.add('is-open');
    document.body.style.overflow = 'hidden';
    document.querySelector('.rq-modal-body').scrollTop = 0;
  };

  window.rqCloseCases = function(e) {
    if (e && e.target && e.target.closest && e.target.closest('.rq-modal-box')) return;
    modal.classList.remove('is-open');
    document.body.style.overflow = '';
  };

  /* ===== 라이트박스 ===== */
  const lb      = document.getElementById('rq-lightbox');
  const lbImg   = document.getElementById('rq-lb-img');
  const lbTitle = document.getElementById('rq-lb-title');
  const lbCount = document.getElementById('rq-lb-count');

  function showLb(i) {
    if (!lbList.length) return;
    lbIndex = (i + lbList.length) % lbList.length;
    var c = lbList[lbIndex];
    lbImg.src = c.url;
    lbTitle.textContent = c.area ? (c.region + ' · ' + c.area) : (c.region || '');
    lbCount.textContent = (lbIndex + 1) + ' / ' + lbList.length;
  }

  window.rqOpenLightbox = function(i) {
    showLb(i);
    lb.classList.add('is-open');
  };

  window.rqCloseLightbox = function(e) {
    if (e && e.target && e.target.closest && e.target.closest('.rq-lb-inner')) return;
    lb.classList.remove('is-open');
  };

  window.rqLbMove = function(e, dir) {
    if (e) e.stopPropagation();
    showLb(lbIndex + dir);
  };

  document.addEventListener('keydown', function(e) {
    if (lb.classList.contains('is-open')) {
      if (e.key === 'Escape')     window.rqCloseLightbox();
      if (e.key === 'ArrowLeft')  showLb(lbIndex - 1);
      if (e.key === 'ArrowRight') showLb(lbIndex + 1);
      return;
    }
    if (e.key === 'Escape') window.rqCloseCases();
  });

  var touchX = null;
  lb.addEventListener('touchstart', function(e) {
    touchX = e.changedTouches[0].clientX;
  }, { passive: true });
  lb.addEventListener('touchend', function(e) {
    if (touchX === null) return;
    var diff = e.changedTouches[0].clientX - touchX;
    if (Math.abs(diff) > 50) showLb(lbIndex + (diff < 0 ? 1 : -1));
    touchX = null;
  }, { passive: true });
})();
</script>
