name: 드라이브 이미지 자동 업데이트

on:
  schedule:
    # 매일 오전 8시 (한국 시간) 실행
    - cron: '0 23 * * *'
  workflow_dispatch:
    # 수동 실행 버튼도 제공

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install google-api-python-client google-auth

      - name: 드라이브 스캔 & HTML 업데이트
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python update_map.py

      - name: 변경사항 확인
        id: check_changes
        run: |
          git diff --quiet index.html && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: 변경사항 커밋 & 푸시
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "자동 업데이트: 드라이브 이미지 반영 $(date +'%Y-%m-%d')"
          git push

      - name: 변경사항 없음 알림
        if: steps.check_changes.outputs.changed == 'false'
        run: echo "드라이브에 새 이미지가 없어 업데이트하지 않았습니다."
